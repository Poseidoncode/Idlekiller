[package]
name = "idlekiller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Poseidoncode"]
description = "A Rust-based TUI process manager for identifying and cleaning up resource-heavy processes"
license = "BSD-3-Clause"
repository = "https://github.com/Poseidoncode/Idlekiller"
readme = "README.md"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
sysinfo = "0.38.3"

[target.'cfg(unix)'.dependencies]
# Already in the dependency tree via crossterm; used for graceful shutdown signals.
signal-hook = "0.3.18"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false


